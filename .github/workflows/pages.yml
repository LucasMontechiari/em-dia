# Publica a versão web (mobile/www) no GitHub Pages a cada envio para a branch main.
name: Publicar versão web

on:
  push:
    branches: [main]
    paths: ["mobile/www/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: mobile/www
      - id: deployment
        uses: actions/deploy-pages@v4
